# Small embedded web server only for health/metrics (the worker itself is queue-driven).
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: streamtube-worker
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:streamtube}
    username: ${DB_USERNAME:streamtube}
    password: ${DB_PASSWORD:streamtube}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # The API owns the schema/migrations; the worker only reads/writes existing tables.
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:streamtube}
    password: ${RABBITMQ_PASSWORD:streamtube}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 5s
          multiplier: 2.0
        default-requeue-rejected: false

storage:
  endpoint: ${STORAGE_ENDPOINT:http://minio:9000}
  public-url: ${STORAGE_PUBLIC_URL:http://localhost:9000}
  bucket: ${STORAGE_BUCKET:streamtube-videos}
  access-key: ${STORAGE_ACCESS_KEY:streamtube}
  secret-key: ${STORAGE_SECRET_KEY:streamtube_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
