# Production profile: credentials and secrets have NO fallback values here. A missing environment
# variable fails startup fast (unresolved placeholder) instead of silently running with the
# insecure dev defaults from application.yml.
spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

storage:
  endpoint: ${STORAGE_ENDPOINT}
  public-url: ${STORAGE_PUBLIC_URL}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
# Structured JSON logs (ECS) for aggregation; dev keeps the human-readable format.
logging:
  structured:
    format:
      console: ecs
