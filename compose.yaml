services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: streamtube
      DB_USERNAME: streamtube
      DB_PASSWORD: streamtube
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: streamtube
      RABBITMQ_PASSWORD: streamtube
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:9000
      STORAGE_BUCKET: streamtube-videos
      STORAGE_ACCESS_KEY: streamtube
      STORAGE_SECRET_KEY: streamtube_secret
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Read URLs point at the CDN edge below; uploads stay presigned straight to MinIO.
      CDN_ENABLED: "true"
      CDN_BASE_URL: http://localhost:8090/streamtube-videos
      CDN_SECRET: dev-cdn-secret
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      SERVER_PORT: 8081
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: streamtube
      DB_USERNAME: streamtube
      DB_PASSWORD: streamtube
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: streamtube
      RABBITMQ_PASSWORD: streamtube
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:9000
      STORAGE_BUCKET: streamtube-videos
      STORAGE_ACCESS_KEY: streamtube
      STORAGE_SECRET_KEY: streamtube_secret
      # Dev: sweep every 20s so deletions/purges are observable immediately (prod default: 15min).
      CLEANUP_INTERVAL_CRON: "*/20 * * * * *"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The API owns the Flyway migrations; wait until it is healthy so the schema exists.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: streamtube
      POSTGRES_PASSWORD: streamtube
      POSTGRES_DB: streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    # Host ports offset (5673/15673) so this stack coexists with other local RabbitMQ
    # instances; inter-container traffic still uses the service name on 5672.
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: streamtube
      RABBITMQ_DEFAULT_PASS: streamtube
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: streamtube
      MINIO_ROOT_PASSWORD: streamtube_secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 streamtube streamtube_secret &&
      mc mb --ignore-existing local/streamtube-videos &&
      mc anonymous set download local/streamtube-videos &&
      echo 'Bucket ready.'
      "

  # CDN edge simulation: token-auth (secure_link) + response cache in front of MinIO reads.
  # The anonymous-read bucket + unguessable keys trade-off is documented in docs/deploy.md.
  cdn:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    environment:
      CDN_SECRET: dev-cdn-secret
    volumes:
      - ./infra/cdn/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
