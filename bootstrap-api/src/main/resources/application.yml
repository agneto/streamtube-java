server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: streamtube-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:streamtube}
    username: ${DB_USERNAME:streamtube}
    password: ${DB_PASSWORD:streamtube}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:streamtube}
    password: ${RABBITMQ_PASSWORD:streamtube}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://minio:9000}
  public-url: ${STORAGE_PUBLIC_URL:http://localhost:9000}
  bucket: ${STORAGE_BUCKET:streamtube-videos}
  access-key: ${STORAGE_ACCESS_KEY:streamtube}
  secret-key: ${STORAGE_SECRET_KEY:streamtube_secret}

auth:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
  refresh:
    ttl-seconds: ${REFRESH_TTL_SECONDS:2592000}
  email-confirm:
    ttl-seconds: ${EMAIL_CONFIRM_TTL_SECONDS:86400}
  password-reset:
    ttl-seconds: ${PASSWORD_RESET_TTL_SECONDS:3600}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@streamtube.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
