server:
  port: ${SERVER_PORT:8080}
  tomcat:
    remoteip:
      # Behind a reverse proxy/LB, resolve the real client IP from X-Forwarded-For — but only
      # when the direct peer is a trusted proxy (default internal-proxies: private/loopback
      # ranges). Public clients cannot spoof it. Rate limiting keys on getRemoteAddr().
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

spring:
  application:
    name: streamtube-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:streamtube}
    username: ${DB_USERNAME:streamtube}
    password: ${DB_PASSWORD:streamtube}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:streamtube}
    password: ${RABBITMQ_PASSWORD:streamtube}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://minio:9000}
  public-url: ${STORAGE_PUBLIC_URL:http://localhost:9000}
  bucket: ${STORAGE_BUCKET:streamtube-videos}
  access-key: ${STORAGE_ACCESS_KEY:streamtube}
  secret-key: ${STORAGE_SECRET_KEY:streamtube_secret}

auth:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
  refresh:
    ttl-seconds: ${REFRESH_TTL_SECONDS:2592000}
  email-confirm:
    ttl-seconds: ${EMAIL_CONFIRM_TTL_SECONDS:86400}
  password-reset:
    ttl-seconds: ${PASSWORD_RESET_TTL_SECONDS:3600}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@streamtube.local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

upload:
  # Maximum declared upload size; also signed into the presigned PUT URL.
  max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:2147483648}
  # Maximum declared custom-thumbnail size (default 5 MiB); also signed into the presigned URL.
  thumbnail-max-size-bytes: ${THUMB_MAX_SIZE_BYTES:5242880}
  # Multipart uploads: part size (default 8 MiB; S3 minimum is 5 MiB for all but the last part)
  # and the TTL of each part URL (longer than the single PUT — slow connections take long per
  # part; expired URLs are simply re-requested).
  part-size-bytes: ${UPLOAD_PART_SIZE_BYTES:8388608}
  part-url-ttl-seconds: ${UPLOAD_PART_URL_TTL_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
