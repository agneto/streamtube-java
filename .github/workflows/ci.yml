# CI/CD. Three jobs:
#   verify  — format gate + full gradle build (unit + integration + Testcontainers E2E + ArchUnit)
#             with inline JUnit annotations on the PR. The ubuntu runner ships Docker, so the E2E
#             suites run for real here (locally they skip when Docker is down: disabledWithoutDocker).
#   images  — build both Dockerfiles on every run (validation); publish to GHCR only on main pushes
#             and v* tags. PRs/forks never authenticate to the registry.
#   release — only on v* tags: after verify+images are green, cut a GitHub Release.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a branch/PR build is fine; cancelling a half-published release is not.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew build

      - name: Report test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/test/*.xml"
          detailed_summary: true
          include_passed: false

      - name: Publish test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"
          retention-days: 7

      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: "**/build/reports/jacoco/test/"
          retention-days: 7
          if-no-files-found: ignore

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Publish only from trusted refs: never from a pull_request (forks get no secrets and a
      # read-only token) and never from dev (integration builds must not litter the registry).
      - name: Should publish
        id: publish
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" != "refs/heads/dev" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/streamtube-${{ matrix.name }}
          # main → latest + sha-<short>; v* tag → X.Y.Z, X.Y, latest (latest=auto skips prereleases).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compose release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${{ github.repository_owner }}"
          {
            echo "body<<EOF"
            echo "### Container images"
            echo ""
            echo '```'
            echo "ghcr.io/${owner}/streamtube-api:${version}"
            echo "ghcr.io/${owner}/streamtube-worker:${version}"
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}
