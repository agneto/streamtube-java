# CodeQL static analysis for Java. Kept separate from ci.yml for its own schedule and the
# security-events permission. Multi-module Gradle needs build-mode: manual — autobuild often
# mis-detects the layered build and analyses nothing.
name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      # Compile only — tests run in ci.yml's verify job. This gives CodeQL the full class graph
      # across every module without paying for the Testcontainers suite again.
      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v3
