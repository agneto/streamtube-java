version: 2
updates:
  # Gradle: the version catalog (gradle/libs.versions.toml) + per-module build scripts.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for the routine minor/patch bumps; majors stay individual for deliberate review.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
